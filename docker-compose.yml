services:
  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: genrisk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: genriskbdd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./genriskbdd.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación Spring Boot
  app:
    build: .
    container_name: genrisk-app
    ports:
      - "8032:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/genriskbdd?zeroDateTimeBehavior=CONVERT_TO_NULL
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

  # phpMyAdmin para administrar la BD
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: genrisk-phpmyadmin
    ports:
      - "8033:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql

volumes:
  mysql_data:
