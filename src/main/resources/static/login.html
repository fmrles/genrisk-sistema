<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GenRisk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container login-container">
    <div class="row min-vh-100 align-items-center">

        <div class="col-md-6 d-none d-md-flex justify-content-center align-items-center">
            <div class="login-icon-placeholder">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>
        </div>

        <div class="col-md-6">
            <div class="text-center">
                <div class="login-title-bubble">
                    Bienvenido al Sistema GenRisk
                </div>
            </div>

            <form id="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label-purple">Ingrese su correo electronico</label>
                    <input type="email" class="form-control form-control-purple" id="email" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label-purple">Ingrese su contraseña</label>
                    <input type="password" class="form-control form-control-purple" id="password" required>
                </div>

                <div id="error-mensaje" class="alert alert-danger d-none" role="alert">
                    Correo o contraseña incorrectos.
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-purple btn-lg">Iniciar sesión</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('login-form').addEventListener('submit', async function(event) {
        event.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorMensaje = document.getElementById('error-mensaje');

        errorMensaje.classList.add('d-none');

        try {
            const response = await fetch('http://localhost:8080/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    correo: email,
                    clave: password
                })
            });

            if (response.ok) {
                window.location.href = 'inicio.html';
            } else {
                errorMensaje.classList.remove('d-none');
            }

        } catch (error) {
            console.error('Error al conectar con la API:', error);
            errorMensaje.innerText = 'Error al conectar con el servidor.';
            errorMensaje.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
