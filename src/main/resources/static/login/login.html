<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GenRisk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container login-container">
    <div class="row min-vh-100 align-items-center">

        <div class="col-md-6 d-none d-md-flex justify-content-center align-items-center">
            <div class="login-icon-placeholder">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>
        </div>

        <div class="col-md-6">
            <div class="text-center">
                <div class="login-title-bubble">
                    Bienvenido al Sistema GenRisk
                </div>
            </div>

            <form id="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label-purple">Ingrese su correo electronico</label>
                    <input type="email" class="form-control form-control-purple" id="email" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label-purple">Ingrese su contraseña</label>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-purple" id="password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Mostrar contraseña">
                            <i class="bi bi-eye-slash-fill"></i>
                        </button>
                    </div>
                </div>
                <div id="error-mensaje" class="alert alert-danger d-none" role="alert">
                    Correo o contraseña incorrectos.
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-purple btn-lg">Iniciar sesión</button>
                </div>
               <div class="text-center mt-3">
                    <a href="/login/forgot.html" class="text-decoration-none text-purple fw-medium">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const error = document.getElementById('error-mensaje');

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ correo: email, clave: password })
        });

        if (res.ok) {
            const usuario = await res.json();
            localStorage.setItem('usuario', JSON.stringify(usuario));
            // REDIRECCIÓN CORRECTA
            window.location.href = '../admin/admin.html';
            // o también: window.location.replace('/admin.html');
        } else {
            error.classList.remove('d-none');
            error.textContent = 'Credenciales incorrectas';
        }
    } catch (err) {
        error.classList.remove('d-none');
        error.textContent = 'Error de conexión';
    }
});

// --- CÓDIGO AÑADIDO PARA MOSTRAR/OCULTAR CONTRASEÑA ---
const togglePassword = document.getElementById('togglePassword');
const passwordInput = document.getElementById('password');

togglePassword.addEventListener('click', function() {
    // Alternar el tipo de input entre 'password' y 'text'
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);

    // Alternar el icono del ojo abierto/cerrado (Bootstrap Icons)
    const icon = togglePassword.querySelector('i');
    icon.classList.toggle('bi-eye-slash-fill'); // Ocultar
    icon.classList.toggle('bi-eye-fill');       // Mostrar
});
</script>
</body>
</html>
